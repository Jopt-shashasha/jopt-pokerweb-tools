<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業務ポータル</title><style>
:root{
  --bg:#ffffff;
  --sidebar:#fafafa;
  --border:#e8e8e8;
  --ink:#181818;
  --ink-soft:#6b6b6b;
  --ink-faint:#a0a0a0;
  --accent:#181818;
  --accent-contrast:#ffffff;
  --highlight:#606060;
  --highlight-soft:#f0f0f0;
  --warn:#7e7e7e;
  --row-hover:#f7f7f7;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;font-size:13.5px;line-height:1.6;}
button{font-family:inherit;cursor:pointer;}

.prototype-flag{background:#f7f7f7;color:#5e5e5e;font-size:11.5px;padding:5px 16px;text-align:center;border-bottom:1px solid #e1e1e1;}

.shell{display:flex;min-height:100vh;}

.sidebar{width:228px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:6px 8px 14px;}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-contrast);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}

.sidebar-btn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:7px 10px;font-size:13px;font-weight:600;margin-bottom:8px;}
.sidebar-btn:hover{background:var(--row-hover);}
.sidebar-btn-accent{background:var(--ink);color:#ffffff;border-color:var(--ink);}
.sidebar-btn-accent:hover{opacity:.9;background:var(--ink);}
.sidebar-btns{margin-bottom:10px;}

.nav-group{margin-bottom:10px;}
.nav-link{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:none;background:none;border-radius:6px;padding:7px 8px;font-size:13px;color:var(--ink-soft);text-align:left;}
.nav-link:hover{background:var(--row-hover);color:var(--ink);}
.nav-link.active{background:var(--ink);color:#ffffff;}
.nav-link .count{font-size:11px;color:inherit;opacity:.6;}
.nav-parent .chev{transition:transform .15s;color:var(--ink-faint);}
.chev.open{transform:rotate(90deg);}
.nav-sub{padding-left:20px;font-size:12.5px;}

.sidebar-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:10px;display:flex;align-items:center;gap:8px;padding-left:8px;}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;border:1px solid var(--border);flex-shrink:0;}
.sidebar-foot .who{font-size:12.5px;font-weight:600;}
.sidebar-foot .mail{font-size:11px;color:var(--ink-faint);}

.main{flex:1;min-width:0;}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--border);}
#menuBtn{display:none;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:4px 9px;font-size:15px;}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0;flex-wrap:wrap;}
.crumb{border:none;background:none;color:var(--ink-faint);padding:0;font-size:13px;}
.crumb:hover{color:var(--ink);text-decoration:underline;}
.crumb-cur{font-weight:600;color:var(--ink);}
.crumb-sep{color:var(--ink-faint);}
.topbar .search{margin-left:auto;position:relative;width:240px;flex-shrink:0;}
.topbar .search input{width:100%;padding:6px 10px 6px 26px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:var(--sidebar);}
.topbar .search .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:12px;}

.content{padding:22px 28px 60px;max-width:1000px;}

.btn{border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:7px 12px;font-size:13px;color:var(--ink);}
.btn:hover{background:var(--row-hover);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#ffffff;}
.btn.primary:hover{opacity:.88;background:var(--accent);}
.btn:disabled{opacity:.55;cursor:default;}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.stat-card{border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat-card .label{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
.stat-card .value{font-size:22px;font-weight:700;}

.tag-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-faint);margin-bottom:22px;}
h2.section-title{font-size:13.5px;margin:0 0 12px;color:var(--ink-soft);font-weight:600;}
h2.section-title .faint{font-weight:400;color:var(--ink-faint);font-size:11.5px;margin-left:6px;}

.home-row{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start;}
.pick-list{display:flex;flex-direction:column;gap:10px;margin-bottom:30px;}
.pick-item{border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;display:flex;flex-direction:column;}
.pick-item:hover{border-color:var(--ink);}
.pick-item .dept-tag{display:inline-block;align-self:flex-start;font-size:10.5px;letter-spacing:.03em;color:var(--highlight);background:var(--highlight-soft);font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:10px;}
.pick-item .benefit{font-size:13.5px;font-weight:600;line-height:1.55;margin-bottom:12px;flex:1;}
.pick-item .source-title{font-size:12px;color:var(--ink-faint);padding-top:10px;border-top:1px solid var(--border);}
.pick-item:hover .source-title{color:var(--ink);}

.news-item{padding:12px 0;border-top:1px solid var(--border);cursor:pointer;}
.news-item:first-of-type{border-top:none;padding-top:0;}
.news-item .headline{font-size:13.5px;font-weight:600;}
.news-item:hover .headline{text-decoration:underline;}
.news-item .date{font-size:11px;color:var(--ink-faint);margin-top:3px;}
.news-note{font-size:11px;color:var(--ink-faint);margin-top:12px;}

.chip{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--ink-soft);}
.chip:hover{border-color:var(--ink);color:var(--ink);}
.chip.active{background:var(--ink);border-color:var(--ink);color:#ffffff;}
.active-filters{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 14px;}
.count{font-size:12px;color:var(--ink-faint);margin-bottom:6px;}

table.data-table{width:100%;max-width:880px;border-collapse:collapse;font-size:13px;table-layout:fixed;}
table.data-table col.c-owner{width:84px;}
table.data-table col.c-date{width:74px;}
table.data-table col.c-action{width:104px;}
table.data-table thead th{text-align:left;font-size:11.5px;color:var(--ink-faint);font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--border);}
table.data-table tbody td{padding:11px 10px 11px 0;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data-table tbody tr:hover{background:var(--row-hover);}
table.data-table .r-name{display:flex;align-items:center;gap:10px;cursor:pointer;}
table.data-table .r-ic{width:30px;height:30px;border-radius:7px;background:var(--sidebar);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
table.data-table .r-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
table.data-table .r-tags{color:var(--ink-faint);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
table.data-table .r-actions{white-space:nowrap;}
.icon-btn{border:none;background:none;color:var(--ink-faint);font-size:16px;padding:2px 5px;border-radius:6px;}
.icon-btn:hover{background:var(--row-hover);color:var(--ink);}
.icon-btn.active{color:var(--warn);}
.empty{color:var(--ink-faint);font-size:12.5px;padding:18px 0;}

.pv-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-start;}
.pv-title{font-size:18px;margin:0;}
.pv-sub{color:var(--ink-faint);font-size:12px;margin-top:2px;}
.pv-actions{display:flex;gap:8px;}
.pv-note{background:#f7f7f7;color:#5e5e5e;border:1px solid #e1e1e1;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:16px;}
table.sheet{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--border);}
table.sheet th{background:var(--sidebar);text-align:left;font-size:11.5px;color:var(--ink-soft);padding:8px 12px;border-bottom:1px solid var(--border);}
table.sheet td{padding:9px 12px;border-bottom:1px solid var(--border);}
table.sheet td.num,table.sheet th.num{text-align:right;}
table.sheet tfoot td{font-weight:700;background:var(--sidebar);}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.k-col{background:var(--sidebar);border:1px solid var(--border);border-radius:10px;padding:12px;}
.k-col h4{margin:0 0 10px;font-size:12px;color:var(--ink-soft);}
.k-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;font-size:12.5px;}

.modal-backdrop{position:fixed;inset:0;background:rgba(16,16,16,.4);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--bg);border-radius:14px;max-width:480px;width:100%;padding:24px 26px;box-shadow:0 24px 60px rgba(0,0,0,.2);}
.modal.wide{max-width:540px;}
.modal h3{margin:0 0 4px;font-size:16px;}
.modal .close{float:right;border:none;background:none;font-size:16px;color:var(--ink-faint);}
.modal .lead{color:var(--ink-faint);font-size:12px;margin:0 0 14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.inline-row{display:flex;gap:8px;}
.inline-row .btn{white-space:nowrap;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap;}
.detail-row{margin-bottom:10px;font-size:13px;}
.detail-row .k{color:var(--ink-faint);font-size:11px;margin-bottom:2px;}
details.guide{border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:10px;}
details.guide summary{cursor:pointer;font-size:12.5px;color:var(--ink-soft);}
details.guide ul{margin:8px 0 2px;padding-left:18px;font-size:12.5px;}
.success-box{background:var(--highlight-soft);color:var(--highlight);border-radius:8px;padding:12px;font-size:13px;margin-top:4px;}
.flow-box{background:var(--sidebar);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
.flow-box b{color:var(--ink);}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--ink);color:#ffffff;padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;transform:translateY(6px);transition:all .2s;}
.toast.show{opacity:1;transform:translateY(0);}

.codex-panel{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow:auto;margin-bottom:12px;}
.bubble{border-radius:10px;padding:10px 12px;font-size:13px;max-width:92%;}
.bubble.from-codex{background:var(--sidebar);align-self:flex-start;}
.bubble.from-portal{background:var(--highlight-soft);color:var(--highlight);align-self:flex-end;}
.bubble .tag{font-size:10px;text-transform:uppercase;letter-spacing:.03em;opacity:.7;display:block;margin-bottom:3px;}

@media (max-width:760px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15);}
  .sidebar.open{transform:translateX(0);}
  #menuBtn{display:inline-block;}
  .topbar{padding:12px 16px;flex-wrap:wrap;}
  .topbar .search{width:100%;margin-left:0;}
  .content{padding:18px 16px 60px;}
  .stat-row,.home-row,.kanban{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
}

function render(){const r=route();let [k,id,round]=r.parts;if(k==='preview'){k='resource';history.replaceState(null,'','#/resource/'+encodeURIComponent(id||''));}renderNav({...r,parts:[k,id,round]});let content;
 if(!k)content=home();else if(['library','search','mine','saved'].includes(k))content=pageList(k,r.params);else if(k==='sections')content=sections();else if(k==='section'&&SECTIONS.includes(id))content=sectionPage(id);else if(k==='tournaments')content=tournaments();else if(k==='tournament'&&TOURNAMENTS.includes(id))content=tournamentPage(id);else if(k==='edition'&&TOURNAMENTS.includes(id))content=editionPage(id,round||'');else if(k==='business'&&business(id))content=businessPage(business(id));else if(k==='resource'&&byId(id))content=detail(byId(id));else if(k==='news'&&id)content=newsPage(id);else if(k==='news'){crumb([['AIニュース']]);content=heading('AIニュース','以下はすべて画面確認用の架空記事です。')+`<div class="news-list">${NEWS.map(n=>a('/news/'+n.id,`<div class="date">${n.date} · 表示例</div><h2 class="headline">${esc(n.headline)}</h2><p>${esc(n.body[0])}</p>`,'news-item')).join('')}</div>`;}else content=missing();$('page').innerHTML=content+note();$('quickSearch').value=k==='search'?(r.params.get('q')||''):'';document.title=($('page').querySelector('h1')?.textContent||'業務ポータル')+'｜業務ポータル';}
function showCodex(){info('Codexと連携（プレビュー）',`<p class="lead">資料の検索・取得・登録と、AIニュースを受け取る表示例です。実接続は行いません。</p><div class="codex-panel"><div class="bubble from-portal"><span class="tag">あなた → Codex</span>ミッションチャレンジの資料を探して</div><div class="bubble from-codex"><span class="tag">Codex</span>${a('/business/mission','ミッションチャレンジ')}の運用資料、参加管理シート、Voucher関連ツールが見つかりました。</div><div class="bubble from-codex"><span class="tag">AIニュース · 表示例</span>${a('/news/n1',esc(NEWS[0].headline))}</div><div class="bubble from-portal"><span class="tag">あなた → Codex</span>この成果物を業務ポータルに登録して</div><div class="bubble from-codex"><span class="tag">Codex</span>投稿ルールと不足項目を確認し、登録内容の確認へ進みます。</div></div>`);}
function showSlack(m){const example=m||byId(7);info('GitHub資料へのアクセス申請（プレビュー）',`<p class="lead">GitHubの限定共有資料を見つけた社員が、資料の登録者へ閲覧権限を申請する流れです。</p><div class="notice">通知先は資料の登録者を想定しています。実際のSlack送信・承認・GitHub招待は行いません。</div><div class="codex-panel" style="margin-top:16px"><div class="bubble from-portal"><span class="tag">① 社員 → ポータル</span>「${esc(example.title)}」へのアクセスを申請</div><div class="bubble from-codex"><span class="tag">② Slack → 資料の登録者（表示例）</span>サンプルユーザーが資料へのアクセスを希望しています。<br>資料：${esc(example.title)}<br>保存先：GitHub（限定公開）</div><div class="bubble from-codex"><span class="tag">③ 登録者が確認・承認</span>申請者と利用目的を確認し、承認後にGitHubへの招待へ進む想定です。</div></div><p class="sample-note">資料の本体はGitHubに置いたまま、ポータルを発見・申請の入口にします。ポータルの共有設定だけでGitHubの閲覧権限が付くことはありません。</p>`);}

function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('urlField').hidden=m!=='link';$('fileField').hidden=m!=='html';$('rUrl').disabled=m!=='link';$('rUrl').required=m==='link';$('rFile').disabled=m!=='html';$('rFile').required=m==='html';}
function updateBusinesses(){const bs=BUSINESSES.filter(b=>b.section===$('rSection').value);$('rBusiness').innerHTML=bs.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('');}
function updateRecipients(){const limited=$('rShare').value==='指定アカウントのみ';$('recipientField').hidden=!limited;$('rRecipients').required=limited;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.hasAttribute('data-close'))b.closest('dialog').close();if(b?.dataset.toggle){if(b.dataset.toggle==='sections')sectionsOpen=b.getAttribute('aria-expanded')!=='true';else eventsOpen=b.getAttribute('aria-expanded')!=='true';renderNav(route());}if(b?.dataset.mode)setMode(b.dataset.mode);if(b?.dataset.save){const id=Number(b.dataset.save);saved.has(id)?saved.delete(id):saved.add(id);persist();render();toast(saved.has(id)?'保存済みに追加しました':'保存済みから解除しました');}if(b?.dataset.external){const m=byId(b.dataset.external);if(m)info('外部の資料・ツールを開く',`<p class="lead">${esc(m.title)}</p><div class="notice">正式版では登録されたリンク先を開きます。この原型では外部サービスに接続していません。</div>`);}if(b?.dataset.request)showSlack(byId(b.dataset.request));if(e.target.closest('a[href^="#/"]')){document.querySelectorAll('dialog[open]').forEach(d=>d.close());closeSidebar();}});
$('searchForm').onsubmit=e=>{e.preventDefault();go('/search?q='+encodeURIComponent($('quickSearch').value.trim()));};
$('page').addEventListener('change',e=>{if(e.target.closest('#filters')){const r=route(),f=$('filters');for(const name of ['section','type']){const v=f.elements[name].value;if(v)r.params.set(name,v);else r.params.delete(name);}go('/'+r.parts[0]+'?'+r.params.toString());}});
$('menuBtn').onclick=()=>{const on=!$('sidebar').classList.contains('open');$('sidebar').classList.toggle('open',on);$('sidebarOverlay').classList.toggle('show',on);$('menuBtn').setAttribute('aria-expanded',String(on));};$('closeSidebar').onclick=closeSidebar;$('sidebarOverlay').onclick=closeSidebar;
$('openCodexNav').onclick=()=>{closeSidebar();showCodex();};$('openSlackNav').onclick=()=>{closeSidebar();showSlack();};$('accountButton').onclick=()=>info('Googleアカウントでログイン','<p class="lead">正式版では会社のGoogleアカウントでログインします。</p><div class="notice">現在はサンプルユーザーとして表示しています。実際の認証は行いません。</div>');$('openRegister').onclick=()=>{closeSidebar();$('registerDialog').showModal();};
$('rSection').innerHTML=SECTIONS.map(s=>`<option>${s}</option>`).join('');$('rSection').value='カスタマー';$('rTournament').innerHTML=[...TOURNAMENTS,'共通'].map(t=>`<option>${t}</option>`).join('');updateBusinesses();$('rSection').onchange=updateBusinesses;$('rShare').onchange=updateRecipients;setMode('link');
$('registerForm').addEventListener('input',e=>e.target.setCustomValidity?.(''));
$('registerForm').onsubmit=e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const title=$('rTitle').value.trim();if(!title){$('rTitle').setCustomValidity('タイトルを入力してください');$('rTitle').reportValidity();return;}if(mode==='link'&&!/^https?:\/\//i.test($('rUrl').value)){$('rUrl').setCustomValidity('http:// または https:// のURLを入力してください');$('rUrl').reportValidity();return;}if(mode==='html'&&!/\.html?$/i.test($('rFile').files[0]?.name||'')){toast('HTMLファイルを選んでください');return;}const filename=mode==='html'?$('rFile').files[0].name:'';const id=Math.max(1000,...MATERIALS.map(m=>m.id))+1;MATERIALS.unshift({id,title,business:$('rBusiness').value,section:$('rSection').value,tournament:$('rTournament').value,round:$('rRound').value,tag:$('rTag').value.trim()||'その他',purpose:$('rPurpose').value.trim()||'デモで登録した資料です。',type:mode==='html'?'HTML':'リンク',link:mode==='html'?'HTML資料（未アップロード）':$('rUrl').value.trim(),filename,share:$('rShare').value,recipients:$('rShare').value==='指定アカウントのみ'?$('rRecipients').value:'',owner:'sha',updated:new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric'}).format(new Date())});persist();f.reset();$('rSection').value='カスタマー';updateBusinesses();updateRecipients();setMode('link');$('registerDialog').close();go('/resource/'+id);toast('デモ内に登録しました。実際の保存・送信は行っていません。');};
window.addEventListener('hashchange',()=>{document.querySelectorAll('dialog[open]').forEach(d=>d.close());closeSidebar();render();window.scrollTo(0,0);});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar();});render();
</script></body></html>
