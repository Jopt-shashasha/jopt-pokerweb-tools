<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101619"><title>業務ポータル</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><a class="skip" href="#page">本文へ移動</a><div id="local-banner" hidden>ローカル開発環境 · このPCのデータを使用しています</div><div class="portal">
<header class="simple-header"><a href="#/" class="brand"><i>J</i>業務ポータル</a><div class="header-actions"><button id="codex" class="secondary">Codexと連携</button><button id="slack" class="secondary">Slack連携</button><button id="account" class="secondary">ログイン</button><button id="register" class="primary" hidden>＋ 登録</button></div></header>
<div class="inner"><nav aria-label="メイン"><a href="#/" data-nav="home">ホーム</a><a href="#/library" data-nav="library">資料・ツール</a><a href="#/mine" data-nav="mine">自分の資料</a><a href="#/saved" data-nav="saved">保存済み</a></nav><main id="page" tabindex="-1" aria-live="polite"><p class="empty">読み込んでいます…</p></main><footer><span>業務ポータル</span><span>元の資料・ツールはそれぞれの共有先で開きます</span></footer></div></div>
<dialog id="register-dialog" aria-labelledby="registration-title"><div class="modal-top"><div><span class="eyebrow">共有する</span><h2 id="registration-title">資料・ツールを登録</h2></div><button class="close" aria-label="閉じる">×</button></div><div class="tabs"><button data-mode="link" class="selected">リンクを登録</button><button data-mode="html">HTMLをアップロード</button></div>
<form id="registration"><label>タイトル <em>必須</em><input name="title" required maxlength="160"></label><label id="url-field">リンクURL <em>必須</em><input name="url" type="url" placeholder="https://…"></label><label id="file-field" hidden>HTMLファイル <em>必須</em><input name="file" type="file" accept=".html,.htm,text/html"><small>100 MBまで。アップロード後にプレビューを確認して共有できます。</small></label><label>何に使えるか<textarea name="description" rows="3" maxlength="12000" placeholder="用途や、どんな場面で使えるか（任意）"></textarea></label><div class="form-grid"><label>セクション<select name="department_id"></select></label><label>資料の種類<select name="kind"><option value="">未分類</option><option value="document">資料</option><option value="tool">ツール</option></select></label><fieldset class="event-selection"><legend>大会タグ（複数選択可）</legend><div id="event-choices"></div></fieldset><label>開催年・開催回<input name="edition" maxlength="100" placeholder="任意・例：2026 #03"></label></div><label>説明書（MD・任意）<input name="markdown_file" type="file" accept=".md,text/markdown"><small id="markdown-hint">作成済みのREADME.mdを一緒に添付できます。256 KBまで。本文も検索対象になります。</small></label><details class="extra-tags"><summary>補足タグ（任意）</summary><label>タグ<input name="tags" placeholder="カンマ区切り・新しいタグも追加できます" maxlength="1200"></label><small>既存のタグを優先して選べます。タグがなくても資料本文から検索できます。</small><div id="tag-suggestions" class="tag-suggestions"></div></details><label id="creator-field" hidden>作成者<select name="creator_id"></select><small>登録者・更新者は操作履歴に別途記録されます。</small></label><div class="form-grid"><label>共有範囲<select name="visibility"><option value="company">社内共有</option><option value="private">自分だけ</option></select></label><label id="status-field" hidden>状態<select name="status"><option value="published">共有中</option><option value="draft">下書き</option><option value="archived">アーカイブ</option></select></label></div><label class="checkbox"><input name="access_request" type="checkbox">リンク先の閲覧に権限申請が必要</label><p class="muted">保存済みHTML・MDからプレビューを自動生成します。生成できない場合はカバーを表示します。</p><p id="form-error" class="error" role="alert"></p><div class="form-bottom"><span id="upload-status" role="status"></span><button class="primary" type="submit" id="submit-registration">登録する</button></div></form></dialog>
<dialog id="info-dialog"><div class="modal-top"><h2 id="info-title"></h2><button class="close" aria-label="閉じる">×</button></div><div id="info-body"></div></dialog><div id="toast" role="status"></div></body></html>
