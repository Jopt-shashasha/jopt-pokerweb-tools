<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101619"><title>業務ポータル</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<main class="portal">
<header class="simple-header"><a href="#/" class="brand"><i></i>業務ポータル</a><div class="header-actions"><button class="secondary" id="codex">⌘ Codexと連携</button><button class="secondary" id="account">ログイン</button><button class="secondary" id="register">＋ 登録</button></div></header>
<div class="inner"><nav aria-label="メイン"><a href="#/" data-nav="home">ホーム</a><a href="#/library" data-nav="library">資料・ツール</a><a href="#/mine" data-nav="mine">自分の資料</a><a href="#/saved" data-nav="saved">保存済み</a></nav><div id="page"></div><footer><span>画面確認用 · すべてデモデータ</span><span>AIFACTの掲載題材を参考にした架空の業務・資料です</span></footer></div></main>
<dialog id="detail-dialog"><div id="detail-content"></div></dialog>
<dialog id="register-dialog"><div class="modal-top"><div><div class="eyebrow">資料の登録</div><h2>資料・ツールを登録</h2></div><button class="close" aria-label="閉じる">×</button></div><p class="modal-description">チームで使う情報を、ひとつの場所に。</p><div class="notice">画面確認用です。入力・ファイルは外部へ送信されません。</div><div class="tabs"><button class="selected" data-mode="link">↗ リンクを登録</button><button data-mode="html">↑ HTMLをアップロード</button></div><form id="registration"><label>タイトル <em>必須</em><input name="title" required maxlength="100" placeholder="例：大会受付チェックリスト"></label><label id="url-field">リンクURL <em>必須</em><input type="url" name="url" placeholder="https://…"></label><label id="file-field" hidden>HTMLファイル <em>必須</em><input type="file" name="file" accept=".html,.htm,text/html"><small>このデモではファイル名のみ確認します。</small></label><label>何に使えるか<textarea name="description" placeholder="用途や、どんな場面で使えるか" rows="2" maxlength="500"></textarea></label><div class="form-grid"><label>セクション<select name="section"><option>カスタマー</option><option>トーナメント</option><option>クリエイティブ</option><option>ロジスティックス</option><option>マーケティング</option><option>ディレクター</option><option>メディア</option><option>営業</option><option>インフルエンサー</option><option>その他</option></select></label><label>大会<select name="event"><option>JOPT</option><option>SPADIE</option><option>戦国</option><option>U-30</option><option>共通</option></select></label></div><label>タグ<input name="tags" placeholder="例：受付, 運営（カンマ区切り）" maxlength="100"></label><label>共有範囲<select name="visibility" id="visibility"><option value="all">JOPT全社</option><option value="limited">指定アカウントのみ</option></select></label><label id="recipients-field" hidden>共有先のメールアドレス <em>必須</em><input type="email" multiple name="recipients" placeholder="name@japanopenpoker.com"><small>複数の場合はカンマ区切り</small></label><div class="form-bottom"><span>このデモ内の一覧に追加されます</span><button class="primary" type="submit">登録する ↗</button></div></form></dialog>
<dialog id="info-dialog"><div id="info-content"></div></dialog><div id="toast" role="status"></div>
</body></html>
