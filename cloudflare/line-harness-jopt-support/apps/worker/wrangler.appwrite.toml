# JOPT free-tier install. No R2 binding or paid storage subscription.
# This source fork must be deployed from source; do not apply vanilla bundles.
name = "line-harness-jopt-support"
main = "src/index.ts"
account_id = "9b50e8cea0fe5553c90404e7757fe679"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "line-harness-jopt-support"
database_id = "9048047a-7ec0-47f8-bb43-8326e70e44f5"

[[durable_objects.bindings]]
name = "TENANT_SCHEDULER"
class_name = "TenantScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantScheduler"]

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

[vars]
CF_CAPACITY_PLAN = "free"
CF_ANALYTICS_TOKEN_EXPIRES_AT = "2027-01-24"
APPWRITE_USAGE_KEY_EXPIRES_AT = "never"
# Official billing UI: Oct 17-Nov 16; use its calendar date as the aggregate start.
# Exact reset hour is not exposed by the project usage API; the UI labels it unconfirmed.
APPWRITE_BILLING_ANCHOR = "2026-10-17T00:00:00.000Z"
# Published Free allowances, expressed conservatively in SI GB (1 GB = 10^9 bytes).
APPWRITE_BANDWIDTH_LIMIT_BYTES = "5000000000"
APPWRITE_STORAGE_LIMIT_BYTES = "2000000000"
CF_ANALYTICS_ACCOUNT_ID = "9b50e8cea0fe5553c90404e7757fe679"
APPWRITE_ENDPOINT = "https://fra.cloud.appwrite.io/v1"
APPWRITE_PROJECT_ID = "6ad33813000dd5ab3dca"
APPWRITE_BUCKET_ID = "6ad338b3002987cffde2"
WORKER_NAME = "line-harness-jopt-support"
WORKER_URL = "https://line-harness-jopt-support.xiao-h-9b5.workers.dev"
ADMIN_ORIGIN = "https://line-harness-jopt-support.xiao-h-9b5.workers.dev"
ADMIN_COOKIE_SAMESITE = "Lax"
LINE_CHANNEL_ID = "2011834690"
LOG_RETENTION_DAYS = "0"
